<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1565c0"><title>Evidence kilometrů</title>
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:auto;padding:20px;background:#f5f7fa;color:#18212b}
h1{margin:0 0 6px;color:#1565c0}.sub{color:#667085;margin-bottom:18px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000010}
label{display:block;font-weight:600;margin:8px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;font-size:17px}
input{border:1px solid #ccd3da}button{border:0;background:#1565c0;color:white;font-weight:700;margin-top:10px}.secondary{background:#e9eef5;color:#18212b}
.total{font-size:25px;font-weight:800;color:#1565c0}.vehicle{font-size:20px;font-weight:700}.row{padding:11px 0;border-bottom:1px solid #e7e9ed}.muted{color:#667085}
</style></head>
<body>
<h1>Evidence kilometrů</h1><div class="sub">Evidence výjezdů během směny</div>

<div class="card">
<label for="vehicle">Číslo vozidla</label>
<input id="vehicle" type="text" inputmode="numeric" placeholder="např. 318">
<label for="start">Počáteční stav tachometru</label>
<input id="start" type="number" inputmode="numeric" placeholder="např. 125430">
<button id="begin">Zahájit směnu</button>
</div>

<div class="card">
<div id="shift" class="vehicle">Směna není zahájena</div>
<div id="last" class="muted" style="margin-top:6px">Zadej vozidlo a počáteční stav.</div>
<label for="current">Nový stav po výjezdu</label>
<input id="current" type="number" inputmode="numeric" placeholder="např. 125447">
<button id="add">Přidat výjezd</button>
</div>

<div class="card"><div class="total" id="total">Celkem: 0 km</div></div>
<div class="card"><b>Historie výjezdů</b><div id="history" style="margin-top:8px"></div></div>
<button class="secondary" id="reset">Nová směna – vymazat aktuální evidenci</button>

<script>
const K="evidenceKm_v2";
let s=JSON.parse(localStorage.getItem(K)||'{"vehicle":"","last":null,"total":0,"trips":[]}');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(K,JSON.stringify(s));render()}
function render(){
 $('vehicle').value=s.vehicle||'';
 $('shift').textContent=s.vehicle?'Vozidlo: '+s.vehicle:'Směna není zahájena';
 $('last').textContent=s.last===null?'Zadej vozidlo a počáteční stav.':'Poslední stav: '+s.last+' km';
 $('total').textContent='Celkem: '+s.total+' km';
 $('history').innerHTML=s.trips.length?s.trips.map((x,i)=>`<div class="row">${i+1}. výjezd — ${x.from} → ${x.to} km <b>+${x.diff} km</b></div>`).join(''):'<div class="muted">Zatím žádné výjezdy.</div>';
}
$('begin').onclick=()=>{
 let v=$('vehicle').value.trim(), k=Number($('start').value);
 if(!v)return alert('Zadej číslo vozidla.');
 if(!Number.isInteger(k)||k<0)return alert('Zadej platný počáteční stav km.');
 s={vehicle:v,last:k,total:0,trips:[]};save();
};
$('add').onclick=()=>{
 if(s.last===null)return alert('Nejdřív zahaj směnu.');
 let k=Number($('current').value);
 if(!Number.isInteger(k)||k<s.last)return alert('Nový stav musí být platné číslo a nesmí být menší než předchozí stav.');
 let d=k-s.last;s.trips.push({from:s.last,to:k,diff:d});s.total+=d;s.last=k;$('current').value='';save();
};
$('reset').onclick=()=>{
 if(confirm('Opravdu ukončit aktuální směnu a vymazat její evidenci?')){
  s={vehicle:'',last:null,total:0,trips:[]};save();$('start').value='';$('current').value='';
 }
};
render();
</script></body></html>
